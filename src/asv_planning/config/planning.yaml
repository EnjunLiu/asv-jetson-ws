state_predictor_node:
  ros__parameters:
    # Low-rate WorldState measurements update the history; this timer publishes
    # the fitted PredictedWorldState at the downstream control rate.
    publish_rate_hz: 10.0
    history_window_size: 3
    maximum_extrapolation_sec: 1.0

    # Exponentially favour recent measurements in the quadratic least-squares fit.
    recency_weight: 2.0
    velocity_regularization: 0.01
    acceleration_regularization: 0.1

decision_node:
  ros__parameters: {}