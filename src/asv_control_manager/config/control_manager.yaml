control_input_mux_node:
  ros__parameters:
    publish_rate_hz: 10.0
    state_timeout_sec: 0.5
    decision_timeout_sec: 0.5

safety_supervisor_node:
  ros__parameters:
    publish_rate_hz: 10.0
    wrench_timeout_sec: 0.5
    max_force: 50.0
    max_moment: 50.0
    emergency_stop: false

thruster_allocator_node:
  ros__parameters:
    # legacy: reproduce edge.py. physical: use explicit thruster spacing.
    allocation_mode: "physical"
    force_gain: 0.5
    moment_gain: 200.0
    thruster_separation: 0.005
    left_sign: 1.0
    right_sign: 1.0
    thruster_limit: 25.0

esp32_param_manager_node:
  ros__parameters:
    target_node: "/esp32_node"
    apply_on_start: true

    time_constant: 10.0
    v_max: 0.5
    e_max: 0.2
    delta_t: 0.1
    gamma_rl: 0.9
    lambda_rls: 0.99
    max_force: 0.5
    max_moment: 0.1
    i_bound_force: 0.1
    d_bound_force: 0.1
    i_bound_moment: 0.0075
    d_bound_moment: 0.005

    param_version: 1
    reset_controller: true

system_monitor_node:
  ros__parameters:
    publish_rate_hz: 2.0
    # Perception is 2 Hz, so its timeout must be longer than one 0.5 s period.
    perception_timeout_sec: 1.0
    prediction_timeout_sec: 0.5
    decision_timeout_sec: 0.5
    control_input_timeout_sec: 0.5
    esp32_wrench_timeout_sec: 0.5
    safe_wrench_timeout_sec: 0.5