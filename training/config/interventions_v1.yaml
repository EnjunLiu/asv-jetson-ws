# Day 16 post-training intervention protocol.
#
# These gates are frozen before the first Day 16 checkpoint evaluation.  Day 16
# may diagnose the already-opened Day 15 test split, but it must not retrain or
# select a new checkpoint from these results.

schema_version: "day16_interventions_v1"
experiment_name: "day16_frozen_policy_interventions"
expected_checkpoint_git_sha: "e93c6ef"
expected_day15_summary_sha256: "c82ab7b726a1c2036e478e0e9541c141b0b362d79ac6dfb970f7a3f4a35d03b4"
expected_run_count: 30
frame_stride: 3
seeds: [17, 23, 42]

language_interventions:
  require_pair_count: 24
  evaluation_run_split: "test"
  evaluation_language_splits: ["train", "validation", "test"]
  minimum_directional_accuracy: 0.60
  minimum_assignment_accuracy: 0.60
  minimum_response_ratio: 0.02

color_swap:
  # L3 and L4 R6 are both held-out validation Runs.  L4 swaps red and blue
  # world positions relative to L3 while R6 and S0 keep the comparison simple.
  left_slot: "L3_S0_R6"
  right_slot: "L4_S0_R6"
  instruction_ids:
    - "follow_red_3m_09"
    - "follow_red_10m_09"
    - "follow_blue_3m_09"
    - "follow_blue_10m_09"
  minimum_directional_accuracy: 0.60
  minimum_assignment_accuracy: 0.60
  minimum_response_ratio: 0.02

ablations:
  variants:
    - "no_language"
    - "no_global_visual"
    - "no_entity_visual"
    - "no_all_visual"
    - "no_entity_geometry"
    - "misaligned_entity_visual"
  # Relative ADE degradation is (ablated - full) / full.  The threshold is
  # deliberately modest but must be positive across the three-seed mean.
  minimum_language_relative_ade_degradation: 0.05
  minimum_visual_color_relative_ade_degradation: 0.05
  minimum_entity_bearing_relative_ade_degradation: 0.05

fail_closed:
  faults:
    - "missing_language"
    - "missing_image"
    - "entity_alignment_error"
  maximum_nonzero_trajectory_m: 0.0
  require_all_invalid: true
  require_stop_selected: true

report:
  maximum_failure_cases: 200
  maximum_trajectory_plots: 40
