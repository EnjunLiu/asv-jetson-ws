# Day 16 validation gate for v6 same-frame paired training.

schema_version: "interventions_v1"
experiment_name: "paired_v6_validation"
expected_checkpoint_git_sha: "a7eb7ab"
expected_training_summary_sha256: "2ddd4a066455eded821d18a570a425c627b6f9e50fbbbf3a8e36887b01551ec1"
require_sealed_test_gate: false
expected_run_count: 30
frame_stride: 3
seeds: [17, 23, 42]

language_interventions:
  require_pair_count: 24
  evaluation_run_split: "validation"
  evaluation_language_splits: ["train", "validation", "test"]
  minimum_directional_accuracy: 0.60
  minimum_assignment_accuracy: 0.60
  minimum_response_ratio: 0.02

color_swap:
  left_slot: "L3_S0_R6"
  right_slot: "L4_S0_R6"
  instruction_ids:
    - "follow_red_10m_09"
    - "follow_blue_10m_09"
  minimum_directional_accuracy: 0.60
  minimum_assignment_accuracy: 0.60
  minimum_response_ratio: 0.02

ablations:
  variants:
    - "no_language"
    - "no_global_visual"
    - "no_entity_visual"
    - "no_all_visual"
    - "no_entity_geometry"
    - "misaligned_entity_visual"
  minimum_language_relative_ade_degradation: 0.05
  minimum_visual_color_relative_ade_degradation: 0.05
  minimum_entity_bearing_relative_ade_degradation: 0.05

fail_closed:
  faults:
    - "missing_language"
    - "missing_image"
    - "entity_alignment_error"
  maximum_nonzero_trajectory_m: 0.0
  require_all_invalid: true
  require_stop_selected: true

report:
  maximum_failure_cases: 200
  maximum_trajectory_plots: 40
