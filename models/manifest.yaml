schema_version: 3

# Runtime deployment manifest for the final S2 near-range image/color demo.
# Artifact hashes are intentionally explicit: the binary files are deployed on
# Jetson and are not checked into this source checkout.
deployment:
  perception:
    path: models/image_entity_color_calibrated_v1.npz
    model_id: image_entity_color_calibrated_v1
    input: jpeg_image_only
    output: geometry_semantics_only
    velocity_output: false
    velocity_source: temporal_entity_tracker
    label_source: frame_record_v1.entities
    device: cuda
    max_primary_distance_m: 5.0
    max_abs_yaw_rad: 0.1
    max_abs_surge_velocity_mps: 1.0
    geometry_metric_mask: camera_projected_visibility_only
    artifact_sha256: 985111c7cfeaea9a927bc59b6b3d6efb2bf40df7e68996d44aa82de4b2014a3c
    acceptance_ready: true
    validation_status: task_conditioned_cuda_online_passed;7m_ood_fail_closed
    acceptance_thresholds:
      min_visibility_accuracy: 0.95
      max_geometry_rmse_m: 0.5
      min_run_visibility_accuracy: 0.95
      max_run_geometry_rmse_m: 0.5
    validation_report: ../pc_datasets/models/image_entity_color_calibrated_v1.json
  policy:
    path: models/policy_sine_near_image_color_seed42.pt
    model_id: policy_sine_near_image_color_seed42
    source_sha256: 6c4ed50d49a0ba9447a3d991cb09de130bbdbcc6eb98eca1b98c49dfd66d7685
    backend: torch_cuda
    device: cuda
    input_contract: frozen_multimodal_481k_v1
    validation_gate_passed: true
    validation_scope: full_seed42_only
    validation_status: seed42_training_gate_passed;cuda_online_passed;other_seeds_pending
    validation_metrics: seed=230908;standoff_target=3m;online_setpoint_stream=35s
    deployment_status: torch_cuda_online_passed
    validation_report: ../pc_datasets/checkpoints/sine_near_image_color_v1/summary.json
  language:
    mode: online_qwen_cuda_resident
    feature_dim: 256
    model_id: Qwen3-Embedding-0.6B
    model_path: models/Qwen3-Embedding-0.6B
    device: cuda
    release_model_after_encode: false
    online_qwen_runtime: true
    first_instruction_encoding: real_qwen_cuda
    qwen_weight_resident_after_encode: true
    post_encode_embedding_online: true
    task_switch_policy: live_instruction_update_for_calibrated_tasks
    s2_task_switch_promised: false
    validation_status: cuda_resident_online_pending_device_recheck;blue_visual_calibration_pending
  visual:
    model_id: torchvision:mobilenet_v3_small:IMAGENET1K_V1
    feature_dim: 576
    token_layout: global_plus_16_entity_slots
    device_default: cuda
  online_entities_topic: /vla/tracked_entities
  privileged_truth_topic: /ue/entities
  privileged_truth_allowed: collection_and_offline_validation_only

training_only:
  language_model: Qwen/Qwen3-Embedding-0.6B
  location: pc_datasets/models/Qwen3-Embedding-0.6B
